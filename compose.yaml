services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kvitto
      POSTGRES_USER: kvitto
      POSTGRES_PASSWORD: kvitto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://kvitto:kvitto@db:5432/kvitto
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
